# Generated by `pts slo-rules` from config/slo.yaml. Do not edit by hand.
groups:
- name: slo-availability
  rules:
  - record: engagement:slo_availability_error_ratio:rate5m
    expr: 1 - (sum(rate(gateway_requests_total{code!~"5.."}[5m])) by (engagement)) / (sum(rate(gateway_requests_total[5m])) by (engagement))
  - record: engagement:slo_availability_error_ratio:rate30m
    expr: 1 - (sum(rate(gateway_requests_total{code!~"5.."}[30m])) by (engagement)) / (sum(rate(gateway_requests_total[30m])) by (engagement))
  - record: engagement:slo_availability_error_ratio:rate1h
    expr: 1 - (sum(rate(gateway_requests_total{code!~"5.."}[1h])) by (engagement)) / (sum(rate(gateway_requests_total[1h])) by (engagement))
  - record: engagement:slo_availability_error_ratio:rate6h
    expr: 1 - (sum(rate(gateway_requests_total{code!~"5.."}[6h])) by (engagement)) / (sum(rate(gateway_requests_total[6h])) by (engagement))
  - record: engagement:slo_availability_error_ratio:rate3d
    expr: 1 - (sum(rate(gateway_requests_total{code!~"5.."}[3d])) by (engagement)) / (sum(rate(gateway_requests_total[3d])) by (engagement))
  - alert: SLOAvailabilityBurn1h
    expr: engagement:slo_availability_error_ratio:rate1h > 0.072 and engagement:slo_availability_error_ratio:rate5m > 0.072
    labels:
      severity: page
      slo: availability
    annotations:
      summary: '{{ $labels.engagement }} burns the availability error budget 14.4x too fast'
      runbook_url: runbooks/slo-availability.md
  - alert: SLOAvailabilityBurn6h
    expr: engagement:slo_availability_error_ratio:rate6h > 0.03 and engagement:slo_availability_error_ratio:rate30m > 0.03
    labels:
      severity: page
      slo: availability
    annotations:
      summary: '{{ $labels.engagement }} burns the availability error budget 6x too fast'
      runbook_url: runbooks/slo-availability.md
  - alert: SLOAvailabilityBurn3d
    expr: engagement:slo_availability_error_ratio:rate3d > 0.005 and engagement:slo_availability_error_ratio:rate6h > 0.005
    labels:
      severity: ticket
      slo: availability
    annotations:
      summary: '{{ $labels.engagement }} burns the availability error budget 1x too fast'
      runbook_url: runbooks/slo-availability.md
- name: slo-latency
  rules:
  - record: engagement:slo_latency_error_ratio:rate5m
    expr: 1 - (sum(rate(gateway_request_seconds_bucket{le="4"}[5m])) by (engagement)) / (sum(rate(gateway_request_seconds_count[5m])) by (engagement))
  - record: engagement:slo_latency_error_ratio:rate30m
    expr: 1 - (sum(rate(gateway_request_seconds_bucket{le="4"}[30m])) by (engagement)) / (sum(rate(gateway_request_seconds_count[30m])) by (engagement))
  - record: engagement:slo_latency_error_ratio:rate1h
    expr: 1 - (sum(rate(gateway_request_seconds_bucket{le="4"}[1h])) by (engagement)) / (sum(rate(gateway_request_seconds_count[1h])) by (engagement))
  - record: engagement:slo_latency_error_ratio:rate6h
    expr: 1 - (sum(rate(gateway_request_seconds_bucket{le="4"}[6h])) by (engagement)) / (sum(rate(gateway_request_seconds_count[6h])) by (engagement))
  - record: engagement:slo_latency_error_ratio:rate3d
    expr: 1 - (sum(rate(gateway_request_seconds_bucket{le="4"}[3d])) by (engagement)) / (sum(rate(gateway_request_seconds_count[3d])) by (engagement))
  - alert: SLOLatencyBurn1h
    expr: engagement:slo_latency_error_ratio:rate1h > 0.72 and engagement:slo_latency_error_ratio:rate5m > 0.72
    labels:
      severity: page
      slo: latency
    annotations:
      summary: '{{ $labels.engagement }} burns the latency error budget 14.4x too fast'
      runbook_url: runbooks/slo-latency.md
  - alert: SLOLatencyBurn6h
    expr: engagement:slo_latency_error_ratio:rate6h > 0.3 and engagement:slo_latency_error_ratio:rate30m > 0.3
    labels:
      severity: page
      slo: latency
    annotations:
      summary: '{{ $labels.engagement }} burns the latency error budget 6x too fast'
      runbook_url: runbooks/slo-latency.md
  - alert: SLOLatencyBurn3d
    expr: engagement:slo_latency_error_ratio:rate3d > 0.05 and engagement:slo_latency_error_ratio:rate6h > 0.05
    labels:
      severity: ticket
      slo: latency
    annotations:
      summary: '{{ $labels.engagement }} burns the latency error budget 1x too fast'
      runbook_url: runbooks/slo-latency.md
