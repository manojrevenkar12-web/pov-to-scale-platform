# Argo CD runs this before syncing a new release into the stage. If the release's metrics from its
# observation window fail the promotion rules (config/promotion.yaml), the Job fails and so does the sync.
apiVersion: batch/v1
kind: Job
metadata:
  name: promotion-gate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: gate
          image: ailabacr.azurecr.io/pts:0.1.0
          args: ["gate", "--stage", "$(TARGET_STAGE)", "--prometheus", "http://prometheus.monitoring.svc:9090",
                 "--engagement", "$(ENGAGEMENT_ID)"]
          envFrom:
            - configMapRef: {name: promotion-gate}
          env:
            - name: ENGAGEMENT_ID
              value: replaced-per-engagement
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
