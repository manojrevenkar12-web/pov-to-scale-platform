apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - hpa.yaml
components: [../../components/production]
labels:
  - pairs: {platform.ailab/stage: scaled}
replicas:
  - name: agent-service
    count: 3
configMapGenerator:
  - name: promotion-gate
    literals: [TARGET_STAGE=scaled]
patches:
  - target: {kind: PodDisruptionBudget, name: agent-service}
    patch: |-
      - op: replace
        path: /spec/minAvailable
        value: 2
