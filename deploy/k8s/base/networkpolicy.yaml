# Engagement namespaces cannot talk to each other. Ingress only from the gateway namespace (APIM ->
# gateway -> service); egress only to the gateway and DNS. Azure OpenAI is reached via the gateway.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: isolate-engagement
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ai-gateway}
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ai-gateway}
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    # Entra ID token exchange for workload identity
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 443}
