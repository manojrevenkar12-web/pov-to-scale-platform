# The service every engagement runs: an agent API that calls Azure OpenAI only through the AI gateway.
# Argo CD sets the namespace (eng-<id>), the image and the workload identity per engagement.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/name: agent-service
      app.kubernetes.io/part-of: pov-to-scale-platform
    includeSelectors: true
resources:
  - serviceaccount.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
