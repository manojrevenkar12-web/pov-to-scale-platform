[project]
name = "pov-to-scale-platform"
version = "0.1.0"
description = "Azure platform that takes GenAI from client PoV to scaled rollout."
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Manoj Kumar Prakash"}]
dependencies = ["pydantic>=2.6", "pyyaml>=6", "fastapi>=0.110", "httpx>=0.27", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
azure = ["azure-identity>=1.17"]

[project.scripts]
pts = "pts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S"]
ignore = ["S311", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
